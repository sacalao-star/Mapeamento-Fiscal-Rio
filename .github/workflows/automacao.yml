name: PRISMA RIO - Motor de Automação Inteligente

on:
  workflow_dispatch: # Permite que você clique em um botão e mande o robô rodar quando quiser
  schedule:
    - cron: '0 6 * * 1' # Roda automaticamente toda segunda-feira às 06:00 UTC

jobs:
  executar-extrator:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Executar Script de Inteligência e Extração
        run: |
          python extrator.py
